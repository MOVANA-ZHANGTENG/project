# Nginx配置文件 - 生产环境API转发配置
# 将 /prod_api 路径转发到后端API服务器

server {
    listen 80;
    server_name localhost;  # 根据实际域名修改

    # 日志配置
    access_log /var/log/nginx/prod_api_access.log;
    error_log /var/log/nginx/prod_api_error.log;

    # 客户端请求体大小限制
    client_max_body_size 100M;

    # API转发配置 - /prod_api 转发到后端
    location /prod_api {
        # 后端API服务器地址（根据实际情况修改）
        # 例如：http://localhost:8007 或 http://192.168.1.100:8080
        proxy_pass http://localhost:8007;
        
        # 重写路径：将 /prod_api 替换为后端实际路径
        # 如果后端路径是 /wcs，则取消注释下面这行，并注释掉上面的 proxy_pass
        # proxy_pass http://localhost:8007/wcs;
        
        # 如果需要保留 /prod_api 前缀，使用下面的配置
        # rewrite ^/prod_api/(.*)$ /$1 break;
        
        # 如果需要将 /prod_api 替换为 /wcs，使用下面的配置
        rewrite ^/prod_api/(.*)$ /wcs/$1 break;
        
        # 设置代理请求头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket支持（如果需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # 静态文件服务（如果需要）
    # location / {
    #     root /usr/share/nginx/html;
    #     index index.html index.htm;
    #     try_files $uri $uri/ /index.html;
    # }
}

